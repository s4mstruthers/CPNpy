# ---------------------------------------------------------------------------
# Build / packaging metadata for CPNpy.
#
# We use the modern PEP 621 layout ([project] table) with setuptools as the
# build backend.  This is the least surprising choice for a pure-Python project
# and works with pip, uv, and py2app alike.
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpnpy"
# The version number lives in one place, cpnpy/__init__.py (__version__): the
# package, the app's update check and the build script all read it from there.
dynamic = ["version"]
description = "A modern ProM and CPN IDE in one app: process mining, Petri nets and coloured Petri nets"
readme = "README.md"
# 3.10 is the floor: we use PEP 604 unions and structural pattern matching.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Struthers" }]

# The engine deliberately has ZERO runtime dependencies: colour sets, the CPN ML
# interpreter, the simulator and the state space tool are all pure standard
# library.  That keeps the core importable from a notebook, a script, or a test
# runner without dragging in a GUI toolkit.
dependencies = []

[project.optional-dependencies]
# The desktop application.  Installed separately so that `import cpnpy` stays
# cheap for headless use (PySide6 is ~150 MB).
# certifi: the certificates the standalone app trusts when it checks GitHub for
# updates (its bundled Python cannot find the system's own).
gui = ["PySide6>=6.6", "certifi"]
dev = ["pytest>=8.0"]
# Optional: the ILP Miner, PM4Py's heuristics net, and a cross-check of the
# built-in algorithms.  PM4Py is AGPL-3.0 licensed.
pm4py = ["pm4py>=2.7"]

[project.scripts]
# Command-line entry points created by `pip install -e .`
cpnpy = "cpnpy.cli:main"

[project.gui-scripts]
cpn-ide = "cpnpy.gui.app:main"
cpnpy-studio = "cpnpy.gui.studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "cpnpy.__version__" }

[tool.setuptools.packages.find]
include = ["cpnpy*"]

[tool.setuptools.package-data]
"cpnpy.gui" = ["resources/*.png"]
# The demo exercises (File ▸ Open Demo Exercises).
"cpnpy" = ["exercises/*.md", "exercises/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
