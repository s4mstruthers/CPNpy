<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shine)"/>
  <!-- input place with one black-token-style (white) token -->
  <circle cx="130" cy="256" r="64" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <circle cx="130" cy="256" r="19" fill="#FFFFFF"/>
  <!-- arc into the transition -->
  <line x1="206" y1="256" x2="222" y2="256" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M 222 238 L 244 256 L 222 274 Z" fill="#FFFFFF"/>
  <!-- transition -->
  <rect x="246" y="160" width="36" height="192" rx="9" fill="#FFFFFF"/>
  <!-- arc out of the transition -->
  <line x1="290" y1="256" x2="304" y2="256" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M 304 238 L 326 256 L 304 274 Z" fill="#FFFFFF"/>
  <!-- output place with coloured tokens -->
  <circle cx="394" cy="256" r="64" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <circle cx="394" cy="234" r="14" fill="#FBBF24"/>
  <circle cx="375" cy="268" r="14" fill="#F472B6"/>
  <circle cx="413" cy="268" r="14" fill="#67E8F9"/>
</svg>
